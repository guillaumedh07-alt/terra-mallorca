    /* Privacy page specific styles */
    .privacy-page-header {

      justify-content: space-between;

      color: var(--earth);
      text-decoration: none;
    }

      font-family: var(--font-sans, var(--font-body));

      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--stone);
      text-decoration: none;
      transition: color 0.2s;

    .privacy-page-back:hover { color: var(--earth); opacity: 1; }
    .privacy-page-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;

    .privacy-page-footer {
      border-top: 1px solid var(--beige);

    .privacy-page-lang {

      margin-bottom: 1.5rem;

    .privacy-page-lang .lang-btn {

      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--stone);
      padding: 0.2rem 0.3rem;
      transition: color 0.2s;
    }
    .privacy-page-lang .lang-btn.active { color: var(--earth); font-weight: 500; }
    .privacy-page-lang .lang-sep { color: var(--beige); font-size: 0.7rem; }

    function applyPrivacyLang(lang) {
      const L = PRIVACY_LANG[lang] || PRIVACY_LANG.es;
      document.documentElement.lang = lang;
      document.getElementById('privacyTitle').textContent = L.title;
      document.getElementById('privacyUpdated').textContent = L.updated;
      document.getElementById('privacyBody').innerHTML = L.html;
      document.getElementById('backLinkTop').textContent = L.back;
      document.getElementById('backLinkBottom').textContent = L.back;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      try { localStorage.setItem('terra_lang', lang); } catch(_) {}
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => applyPrivacyLang(btn.dataset.lang));
    });

    /* Load language from localStorage or default to es */
    const storedLang = (() => { try { return localStorage.getItem('terra_lang'); } catch(_) { return null; } })();
    applyPrivacyLang(storedLang || 'es');

</html>
